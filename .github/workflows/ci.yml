name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.6.0-preview.1

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore TlsClient.slnx --locked-mode
      - run: dotnet format whitespace --folder . --verify-no-changes
      - run: dotnet build TlsClient.slnx --configuration Release --no-restore
        env:
          DOTNET_ROLL_FORWARD: Disable
      - run: >-
          dotnet test TlsClient.slnx --configuration Release --no-build
          --logger "trx;LogFileName=${{ matrix.os }}.trx"
      - run: >-
          dotnet pack src/TlsClient/TlsClient.csproj --configuration Release --no-build
          --no-restore --output artifacts/packages
      - run: >-
          dotnet run --project tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --configuration Release --no-build -- normalize
          artifacts/packages/TlsClient.${{ env.PACKAGE_VERSION }}.nupkg
          artifacts/packages/TlsClient.${{ env.PACKAGE_VERSION }}.snupkg
      - run: >-
          dotnet run --project tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --configuration Release --no-build -- verify
          artifacts/packages/TlsClient.${{ env.PACKAGE_VERSION }}.nupkg
          artifacts/packages/TlsClient.${{ env.PACKAGE_VERSION }}.snupkg
      - run: >-
          dotnet run --project tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --configuration Release --no-build -- sourcelink
          artifacts/packages/TlsClient.${{ env.PACKAGE_VERSION }}.snupkg
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

  reproducibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: >-
          dotnet restore tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --locked-mode
      - run: >-
          dotnet build tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --configuration Release --no-restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: artifacts/matrix
      - run: >-
          dotnet run --project tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --configuration Release --no-build -- compare
          artifacts/matrix/packages-ubuntu-latest/TlsClient.${{ env.PACKAGE_VERSION }}.nupkg
          artifacts/matrix/packages-macos-latest/TlsClient.${{ env.PACKAGE_VERSION }}.nupkg
      - run: >-
          dotnet run --project tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --configuration Release --no-build -- compare
          artifacts/matrix/packages-ubuntu-latest/TlsClient.${{ env.PACKAGE_VERSION }}.nupkg
          artifacts/matrix/packages-windows-latest/TlsClient.${{ env.PACKAGE_VERSION }}.nupkg
      - run: >-
          dotnet run --project tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --configuration Release --no-build -- compare
          artifacts/matrix/packages-ubuntu-latest/TlsClient.${{ env.PACKAGE_VERSION }}.snupkg
          artifacts/matrix/packages-macos-latest/TlsClient.${{ env.PACKAGE_VERSION }}.snupkg
      - run: >-
          dotnet run --project tools/TlsClient.PackageTool/TlsClient.PackageTool.csproj
          --configuration Release --no-build -- compare
          artifacts/matrix/packages-ubuntu-latest/TlsClient.${{ env.PACKAGE_VERSION }}.snupkg
          artifacts/matrix/packages-windows-latest/TlsClient.${{ env.PACKAGE_VERSION }}.snupkg

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUZZ_ITERATIONS: ${{ github.event_name == 'schedule' && '250000' || '25000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore TlsClient.slnx --locked-mode
      - run: dotnet build TlsClient.slnx --configuration Release --no-restore
      - run: >-
          dotnet run --project tools/TlsClient.Fuzz/TlsClient.Fuzz.csproj
          --configuration Release --no-build -- --smoke "$FUZZ_ITERATIONS"

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore TlsClient.slnx --locked-mode
      - run: >-
          dotnet build tools/TlsClient.Performance/TlsClient.Performance.csproj
          --configuration Release --no-restore
      - run: >-
          dotnet run --project tools/TlsClient.Performance/TlsClient.Performance.csproj
          --configuration Release --no-build -- --verify
