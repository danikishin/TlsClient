version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      dotnet-tooling:
        patterns:
          - Microsoft.CodeAnalysis.*
          - Microsoft.SourceLink.*
          - Microsoft.NET.Test.Sdk
          - xunit*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: [dependencies]
